# 푸시와 PR마다: 타입 검사 + 웹 빌드, 린트, 엔진 테스트
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm ci는 Mac에서 만든 lock 파일에 없는 Linux/Windows 전용 선택 패키지(@emnapi 등) 때문에 실패해서 install을 쓴다
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: npm test

